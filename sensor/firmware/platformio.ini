; PlatformIO Configuration for Waste Bin Level Sensor
; Target Board: ESP32-C3 SuperMini (RISC-V, WiFi + BLE, USB-C)

[env:esp32c3]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.filesystem = littlefs

; Build flags
build_flags = 
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=1

; Libraries
lib_deps = 
    mikalhart/TinyGPSPlus@^1.1.0

; Partition scheme: allows OTA + LittleFS
board_build.partitions = min_spiffs.csv
